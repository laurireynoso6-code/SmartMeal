
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartMeal | Iniciar sesión</title>

    <!-- Tipografía -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Iconos -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Estilos generales -->

    <link rel="stylesheet" href="../css/style.css">

    <!-- Estilos de la pantalla de acceso -->

    <style>

        .login-pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(
                135deg,
                #edf8ee 0%,
                #f9fcf8 55%,
                #dff2e1 100%
            );
        }

        .login-tarjeta {
            width: 100%;
            max-width: 450px;
            padding: 42px;
            border: 1px solid #dcebdd;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 18px 50px rgba(
                39, 101, 51, 0.10
            );
        }

        .login-marca {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            color: #253a2a;
            font-size: 26px;
            font-weight: 800;
            text-decoration: none;
        }

        .login-marca i {
            color: #43a047;
            font-size: 29px;
        }

        .login-marca span span {
            color: #43a047;
        }

        .login-titulo {
            margin-bottom: 10px;
            color: #253a2a;
            font-size: 27px;
            font-weight: 800;
            text-align: center;
        }

        .login-descripcion {
            margin-bottom: 32px;
            color: #647568;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .login-formulario {
            display: grid;
            gap: 20px;
        }

        .login-campo {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .login-campo label {
            color: #253a2a;
            font-size: 13px;
            font-weight: 700;
        }

        .login-campo input {
            width: 100%;
            height: 51px;
            padding: 13px 15px;
            border: 1px solid #d7e6d9;
            border-radius: 12px;
            outline: none;
            background: #ffffff;
            color: #253a2a;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        .login-campo input:focus {
            border-color: #43a047;
            box-shadow: 0 0 0 4px rgba(
                67, 160, 71, 0.12
            );
        }

        .login-boton {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #43a047;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-boton:hover:not(:disabled) {
            background: #2e7d32;
        }

        .login-boton:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-mensaje {
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }

        .login-mensaje.error {
            color: #b53d3d;
        }

        .login-mensaje.exito {
            color: #2e7d32;
        }

        .login-volver {
            display: block;
            margin-top: 26px;
            color: #4b8155;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }

        .login-volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .login-tarjeta {
                padding: 28px 23px;
            }

            .login-titulo {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

    <main class="login-pagina">

        <section class="login-tarjeta"
                 aria-labelledby="login-titulo">

            <!-- LOGO -->

            <a href="../index.html"
               class="login-marca">

                <i class="bi bi-heart-pulse-fill"
                   aria-hidden="true"></i>

                <span>
                    Smart<span>Meal</span>
                </span>

            </a>

            <!-- ENCABEZADO -->

            <h1 class="login-titulo"
                id="login-titulo">

                ¡Bienvenido de nuevo!

            </h1>

            <p class="login-descripcion">

                Ingresá con tu cuenta para administrar
                tus compras, alimentos y planes.

            </p>

            <!-- FORMULARIO -->

            <form id="form-login">

                <div class="login-formulario">

                    <div class="login-campo">

                        <label for="login-usuario">
                            Nombre de usuario
                        </label>

                        <input
                            type="text"
                            id="login-usuario"
                            name="usuario"
                            placeholder="Ingresá tu usuario"
                            autocomplete="username"
                            minlength="3"
                            maxlength="30"
                            required
                        >

                    </div>

                    <div class="login-campo">

                        <label for="login-password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button
                        class="login-boton"
                        id="boton-login"
                        type="submit"
                        disabled>

                        <i class="bi bi-box-arrow-in-right"
                           aria-hidden="true"></i>

                        Iniciar sesión

                    </button>

                    <p
                        id="mensaje-login"
                        class="login-mensaje"
                        role="status"
                        aria-live="polite">
                    </p>

                </div>

            </form>

            <!-- VOLVER -->

            <a href="../index.html"
               class="login-volver">

                <i class="bi bi-arrow-left"></i>

                Volver al inicio

            </a>

        </section>

    </main>

    <!-- JAVASCRIPT GENERAL -->

    <script src="../js/script.js"></script>
    <script src="../js/login.js"></script>

    <!-- La lógica del inicio de sesión
         se incorporará en el próximo paso. -->

</body>

</html>
